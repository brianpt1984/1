name: Build GamePilot 0.5 APK
on:
  push:
    branches:
      - gamepilot-0.5-apk-build-temp
    paths:
      - ".github/workflows/build-gamepilot-0.5.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Recreate GamePilot 0.5 source
        shell: bash
        run: |
          rm -rf /tmp/gamepilot-0.5
          mkdir -p /tmp/gamepilot-0.5
          base64 -d gamepilot-build/GamePilot-0.5-direct-lean.zip.b64 > /tmp/gamepilot-0.5.zip
          unzip -q /tmp/gamepilot-0.5.zip -d /tmp/gamepilot-0.5
          test -f /tmp/gamepilot-0.5/tools/build_native.py

      - name: Build with native 0.4 method
        working-directory: /tmp/gamepilot-0.5
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          python3 tools/build_native.py

      - name: Verify GamePilot 0.5 APK
        shell: bash
        run: |
          APK=/tmp/gamepilot-0.5/app/build/native/GamePilot-0.5.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload GamePilot 0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: GamePilot-0.5-apk
          path: /tmp/gamepilot-0.5/app/build/native/GamePilot-0.5.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
